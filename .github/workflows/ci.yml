name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install pnpm and Node.js
        uses: pnpm/setup@v3
        with:
          runtime: node@22
          install: false

      - name: Install dependencies
        shell: bash
        run: |
          if [[ -f pnpm-lock.yaml ]]; then
            pnpm install --frozen-lockfile
          else
            echo "pnpm-lock.yaml is not committed yet; performing the bootstrap install."
            pnpm install --no-frozen-lockfile
          fi

      - run: pnpm check
      - run: pnpm content:validate
      - run: pnpm assets:validate
